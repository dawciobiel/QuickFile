[pytest]
# Only the real suite. scripts/ holds manual diagnostics whose names start with
# test_ but assert nothing; one of them used to load eight plugin processes and
# leak them into the session (and abort the interpreter at exit).
testpaths = tests

# Add the project root to the pythonpath
pythonpath = .

# Opcje logowania do pliku
log_file = logs/test_results.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_file_date_format = %Y-%m-%d %H:%M:%S
log_file_mode = a
