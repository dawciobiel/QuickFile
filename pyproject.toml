[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "QuickFile"
version = "0.21.17"
description = "Modular file manager with a plugin system"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# Metadata for the pip path. The Nix devshell provides the same packages.
dependencies = [
    "PyQt6>=6.8,<6.9",
    "psutil",
    "rarfile",
    "Send2Trash",
    "Pygments",
]

[project.gui-scripts]
QuickFile = "main:main"

[tool.setuptools]
# Launcher and version module live at the project root and are not part of
# any package.
py-modules = ["main", "__version__"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "app*",
    "browser*",
    "favorites*",
    "file_operations*",
    "panels*",
    "plugins*",
    "resources*",
    "ui*",
    "utils*",
]
# plugins-external/ holds sources for packages published separately. It must
# never end up inside the application wheel or the PyInstaller bundle.
exclude = ["tests*", "experiments*", "scripts*", "build*", "dist*", "plugins-external*"]

[tool.setuptools.package-data]
# Resources (icons, themes, translations, config defaults) are shipped with
# the package so that a pip-installed QuickFile behaves like a source checkout.
resources = ["**/*"]
ui = ["*.ui"]
# Plugin directories contain a dot (org.quickfile.*) and are therefore not
# importable packages: they are loaded by file path and shipped as data.
plugins = ["**/*.py", "**/*.json", "**/*.ui", "**/*.svg"]

[tool.ruff]
# Default rule set (E4, E7, E9, F). Formatting rules are opt-in.
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Plugin entry modules insert their own directory into sys.path so they can
# import sibling modules (relative imports do not work: plugins are loaded by
# file path). The imports after that block are intentional.
"plugins/org.quickfile/linux_attribute_editor/*/plugin.py" = ["E402"]
"plugins/org.quickfile/standard_viewer/*/plugin.py" = ["E402"]
"plugins/org.quickfile/symlink_manager/*/plugin.py" = ["E402"]
"plugins/org.quickfile/windows_operations/*/plugin.py" = ["E402"]
# Same pattern: the script puts the project root on sys.path before importing
# the application modules.
"scripts/replay_actions.py" = ["E402"]
