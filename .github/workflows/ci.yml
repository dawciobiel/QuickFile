# This is a basic workflow to help you get started with Actions

name: QuickFile CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" and "feature/testing" branches
  push:
    branches: [ "master", "feature/testing" ]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Sets up python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Installs dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # If you have dev-specific requirements, install them too
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi
      
      # Install system dependencies for PyQt
      - name: Install Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 xvfb

      # Runs pytest with a virtual screen
      - name: Run tests with pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest
